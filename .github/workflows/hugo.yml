name: test hugo

on: [pull_request]

env:
  NODE_VERSION: 22
  HUGO_VERSION: 0.152.2

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Filenames
        id: lint_filenames
        continue-on-error: false
        run: |
          # Mixed-case names break on case-sensitive filesystems, so every file
          # and directory name must be all-lowercase or all-uppercase.
          #
          # This replaces julie-ng/lowercase-linter@v1, which applied the same
          # rule but carried a hardcoded exception list that cannot be extended
          # via inputs. That list predates the now-standard agent instruction
          # files (AGENTS.md, CLAUDE.md, SKILL.md), which must use those exact
          # names to be discovered and so cannot simply be renamed.
          ALLOW='^(CONTRIBUTING\.md|LICENSE\.md|README\.md|SECURITY\.md|Dockerfile|CHANGELOG\.md|Changelog\.md|Readme\.md|AGENTS\.md|CLAUDE\.md|SKILL\.md)$'

          violations=$(git ls-files | tr '/' '\n' | sort -u \
            | grep '[a-z]' | grep '[A-Z]' | grep -Ev "$ALLOW" || true)

          if [ -n "$violations" ]; then
            echo "::error::Mixed-case names found. Rename these to lowercase-with-dashes:"
            echo "$violations" | while read -r name; do
              echo "::error::  $name  ==>  $(echo "$name" | tr '[:upper:]' '[:lower:]')"
            done
            echo ""
            echo "Mixed-case names cause problems because git and Linux are case-sensitive."
            echo "If you rename a speaker, organizer or sponsor file, remember to update the"
            echo "matching 'image =' or 'id:' value that points at it."
            exit 1
          fi
          echo "No mixed-case filenames found."
  test-linux:
    needs: lint
    name: Build hugo on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 1 # Fetch recent history for .GitInfo and .Lastmod at level 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build Hugo
        run: hugo --environment=production --minify --templateMetrics --logLevel info

