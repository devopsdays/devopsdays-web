name: "2026-philadelphia" # The name of the event. Four digit year with the city name in lower-case, with no spaces.
year: "2026" # The year of the event. Make sure it is in quotes.
city: "Philadelphia" # The displayed city name of the event. Capitalize it.
event_twitter: "DevOpsDaysPHL" # Change this to the twitter handle for your event such as devopsdayschi or devopsdaysmsp
description: "Devopsdays is coming to Philadelphia!" # Edit this to suit your preferences
ga_tracking_id: "" # If you have your own Google Analytics tracking ID, enter it here. Example: "UA-74738648-1"
# All dates are in unquoted 2026-MM-DDTHH:MM:SS+TZ:TZ, like this:
#   variable: 2019-01-04T00:00:00+02:00
#   variable: 2019-01-05T23:59:59+02:00
# Note: we allow 2026-MM-DD for backward compatibility, but it can lead to unexpected behaviors (like your event disappearing from the front page during your last day)

startdate: 2026-10-01T00:00:00+02:00
enddate: 2026-10-02T23:59:59+02:00

# Leave CFP dates blank if you don't know yet, or set all three at once.
cfp_date_start: 2026-07-01T00:00:00+02:00 # start accepting talk proposals.
cfp_date_end: 2026-09-04T23:59:59+02:00 # close your call for proposals.
cfp_date_announce:  2026-09-14T00:00:00+02:00 # inform proposers of status

cfp_link: "" #if you have a custom link for submitting proposals, add it here. This will control the Propose menu item as well as the "Propose" button.

registration_date_start: 2026-08-30T00:00:00+02:00 # start accepting registration. Leave blank if registration is not open yet. This will make the "Register" button appear on your "Welcome" page.
registration_date_end: 2026-10-01T23:59:59+02:00 # close registration. Leave blank if registration is not open yet. If you set "registration_date_start" you need a value here.

registration_closed: "" #set this to true if you need to manually close registration before your registration end date
registration_link: "https://www.eventbrite.com/e/devopsdays-philadelphia-2026-october-1st-2nd-tickets-1998439433141?aff=devopsdays" # If you have a custom registration link, enter it here. This will control the Registration menu item as well as the "Register" button.

# Location
#
coordinates: "39.948896,-75.146486" # No longer used

location: "Science History Institute" # Defaults to city, but you can make it the venue name.
#
location_address: "315 Chestnut Street, Philadelphia, PA 19106" #Optional - use the street address of your venue. This will show up on the welcome page if set. Also used by the event_map shortcode!

# Optional - Social badges
# These can be used in the body of any page via matching shortcodes. See sample:  https://devopsdays.org/events/2025-denver/welcome/
event_social_linkedin: "https://linkedin.com/company/DevOpsDaysPHL" # Change this to the url to your Linkedin group, company, or page.
event_social_slack: "https://join.slack.com/t/DevOpsDaysPHL/custom_shared_invite_url" # Change this to your slack invite link.
event_social_listserv: "https://lists.devopsdays.org/subscription?custom_listserv_invite_url" # Change this to your mailing list subscription form url.
event_social_twitter: "DevOpsDaysPHL" # Change this to the twitter handle for your event such as devopsdayschi or devopsdaysmsp
event_social_mastodon: "https://mastodon.social/@DevOpsDaysPHL" # Change this to url to your mastodon page
event_social_bsky: "https://bsky.app/profile/DevOpsDaysPHL.bsky.social" # Change this to url to your bluesky page
event_social_youtube: "DevOpsDaysPHL" # Change this to the youtube channel handle for your event such as devopsdaysrox


# Social Share Buttons
# Optional: Specify which social share buttons to display on event pages.
# If not specified, defaults to all: ["email", "twitter", "facebook", "linkedin"]
# Valid values: "email", "twitter", "facebook", "linkedin"
# Example: social_shares: ["email", "linkedin"]  # Only show email and LinkedIn share buttons
social_shares: # ["email", "twitter", "facebook", "linkedin"]

nav_elements: # List of pages you want to show up in the navigation of your page.
  - name: propose
  - name: location
  - name: registration
  - name: program
  - name: speakers
  - name: sponsor
  - name: contact
  - name: conduct
# - name: example
#   icon: "map-o" # This is a font-awesome icon that will display on small screens. Choose at http://fontawesome.io/icons/
#   url: http://mycfp.com # The url setting is optional, and only if you want the navigation to link off-site


# These are the same people you have on the mailing list and Slack channel.
# Carried over from 2025-philadelphia's team_members as a starting point.
team_members: # Name is the only required field for team members.
  - name: "Damion Waltermeyer"
    twitter: "Damionw"
    linkedin: "https://www.linkedin.com/in/damionwaltermeyer/"
    role: "Lead Organizer"
  - name: "Hilary Muludiang"
    employer: "Koalafi, Inc."
    linkedin: "http://linkedin.com/in/hlmuludiang"
  - name: "Shaheen Beg"
    twitter: "shaheenbeg"
    employer: "Comcast"
  - name: "David Grizzanti"
    twitter: "dgrizzanti"
    linkedin: "https://www.linkedin.com/in/davidgrizzanti/"
    role: "Organizer"

organizer_email: "philadelphia@devopsdays.org" # Put your organizer email address here

# List all of your sponsors here along with what level of sponsorship they have.
# Check data/sponsors/ to use sponsors already added by others.
sponsors:
  - id: liatrio
    level: gold
  - id: devitjobs
    level: community
  - id: kubeevents
    level: community

 #  - id: samplesponsorname
 #   level: gold
 #  url: http://mysponsor.com/?campaign=me # Use this if you need to over-ride a sponsor URL.

sponsors_accepted : "yes" # Whether you want "Become a XXX Sponsor!" link

# In this section, list the level of sponsorships and the label to use.
# You may optionally include a "max" attribute to limit the number of sponsors per level. For
# unlimited sponsors, omit the max attribute or set it to 0. If you want to prevent all
# sponsorship for a specific level, it is best to remove the level.
sponsor_levels:
  - id: platinum
    label: Platinum
#    max: 10
  - id: gold
    label: Gold
  - id: silver
    label: Silver
    max: 0 # This is the same as omitting the max limit.
  - id: community
    label: Community
