name: "2027-baltimore" # The name of the event. Four digit year with the city name in lower-case, with no spaces.
year: "2027" # The year of the event. Make sure it is in quotes.
city: "Baltimore" # The displayed city name of the event. Capitalize it.
#event_twitter: "DevOpsDaysBmore" # Change this to the twitter handle for your event such as devopsdayschi or devopsdaysmsp
description: "Devopsdays is coming to Baltimore!" # Edit this to suit your preferences
ga_tracking_id: "G-354CWBXNWF" # If you have your own Google Analytics tracking ID, enter it here. Example: "UA-74738648-1"

# All dates are in unquoted 2027-MM-DDTHH:MM:SS+TZ:TZ, like this:
#   variable: 2019-01-04T00:00:00+02:00
#   variable: 2019-01-05T23:59:59+02:00
# Note: we allow 2027-MM-DD for backward compatibility, but it can lead to unexpected behaviors (like your event disappearing from the front page during your last day)

startdate: 2027-05-18T00:00:00-04:00  # The start date of your event. Leave blank if you don't have a venue reserved yet.
enddate: 2027-05-19T23:59:59-04:00 # The end date of your event. Leave blank if you don't have a venue reserved yet.

# Leave CFP dates blank if you don't know yet, or set all three at once.
cfp_date_start: 2026-11-12T00:00:00-04:00 # start accepting talk proposals.
cfp_date_end: 2027-02-15T23:59:59-04:00  # close your call for proposals.
cfp_date_announce:  # inform proposers of status

cfp_link: "https://talks.devopsdays.org/devopsdays-baltimore-2027/cfp" #if you have a custom link for submitting proposals, add it here. This will control the Propose menu item as well as the "Propose" button.

registration_date_start: # start accepting registration. Leave blank if registration is not open yet. This will make the "Register" button appear on your "Welcome" page.
registration_date_end: # close registration. Leave blank if registration is not open yet. If you set "registration_date_start" you need a value here.

registration_closed: "" #set this to true if you need to manually close registration before your registration end date
registration_link: "" # If you have a custom registration link, enter it here. This will control the Registration menu item as well as the "Register" button.

sponsor_faq_link: "https://docs.google.com/document/d/1f2t1RWzInLeRBT7j0LKArO82DdXK-fw1/edit?usp=sharing&ouid=109455848279006338205&rtpof=true&sd=true"
sponsor_registration_link: "https://forms.gle/QiZaod2FmYSxNSrR6"

# Location
#
# coordinates: "" # No longer used

location: "R. House Baltimore" # Defaults to city, but you can make it the venue name.
#
location_address: "301 W 29th St, Baltimore, MD 21211" #Optional - use the street address of your venue. This will show up on the welcome page if set. Also used by the event_map shortcode!

# Optional - Social badges
# These can be used in the body of any page via matching shortcodes. See sample:  https://devopsdays.org/events/2025-denver/welcome/
event_social_linkedin: "https://www.linkedin.com/company/devopsdays-baltimore"
event_social_slack: "http://baltimoretechslack.com/"
#event_social_listserv: "https://lists.devopsdays.org/subscription?custom_listserv_invite_url" # Change this to your mailing list subscription form url. #TODO
#event_social_twitter: "DevOpsDaysBmore" # Nah
#event_social_mastodon: "https://mastodon.social/@DevOpsDaysBmore" #TODO?
#event_social_bsky: "https://bsky.app/profile/DevOpsDaysBmore.bsky.social" #TODO?
event_social_youtube: "DevOpsDaysBaltimore"


# Social Share Buttons
# Optional: Specify which social share buttons to display on event pages.
# If not specified, defaults to all: ["email", "twitter", "facebook", "linkedin"]
# Valid values: "email", "twitter", "facebook", "linkedin"
# Example: social_shares: ["email", "linkedin"]  # Only show email and LinkedIn share buttons
social_shares: # ["email", "linkedin"]

