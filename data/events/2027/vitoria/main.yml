name: "2027-vitoria" # The name of the event. Four digit year with the city name in lower-case, with no spaces.
year: "2027" # The year of the event. Make sure it is in quotes.
city: "Vitoria" # The displayed city name of the event. Capitalize it.
event_twitter: "devopsdaysvix" # Change this to the twitter handle for your event such as devopsdayschi or devopsdaysmsp
description: "O DevOpsDays está voltando para Vitoria!" # Edit this to suit your preferences
ga_tracking_id: "" # If you have your own Google Analytics tracking ID, enter it here. Example: "UA-74738648-1"

# All dates are in unquoted 2027-MM-DDTHH:MM:SS+TZ:TZ, like this:
#   variable: 2019-01-04T00:00:00+02:00
#   variable: 2019-01-05T23:59:59+02:00
# Note: we allow 2027-MM-DD for backward compatibility, but it can lead to unexpected behaviors (like your event disappearing from the front page during your last day)

startdate: 2027-01-23T09:00:00-03:00 # The start date of your event. Leave blank if you don't have a venue reserved yet.
enddate: 2027-01-23T18:00:00-03:00 # The end date of your event. Leave blank if you don't have a venue reserved yet.

# Leave CFP dates blank if you don't know yet, or set all three at once.
cfp_date_start:  # start accepting talk proposals.
cfp_date_end:  # close your call for proposals.
cfp_date_announce:  # inform proposers of status

cfp_link: "" #if you have a custom link for submitting proposals, add it here. This will control the Propose menu item as well as the "Propose" button.

registration_open: "true" # Shows the "Register" button on the Welcome page without needing registration dates.
registration_date_start: # start accepting registration. Leave blank if registration is not open yet. This will make the "Register" button appear on your "Welcome" page.
registration_date_end: # close registration. Leave blank if registration is not open yet. If you set "registration_date_start" you need a value here.

registration_closed: "" #set this to true if you need to manually close registration before your registration end date
registration_link: "https://tickets.devopsdays.org/devopsdays-vitoria/vix-2027/" # If you have a custom registration link, enter it here. This will control the Registration menu item as well as the "Register" button.

# Location
#
coordinates: "-20.292398840667026,-40.299710299999994" # Still read by the event_map shortcode.

location: "Vitória Grand Hall" # Defaults to city, but you can make it the venue name.
#
location_address: "R. Dr. João Carlos de Souza, 55 - Santa Luíza, Vitória - ES, 29045-410" #Optional - use the street address of your venue. This will show up on the welcome page if set. Also used by the event_map shortcode!

# Optional - Social badges
# These can be used in the body of any page via matching shortcodes. See sample:  https://devopsdays.org/events/2025-denver/welcome/
event_social_linkedin: "https://www.linkedin.com/company/devopsdays-vitoria" # Change this to the url to your Linkedin group, company, or page.
event_social_slack: "" # Change this to your slack invite link.
event_social_listserv: "" # Change this to your mailing list subscription form url.
event_social_twitter: "devopsdaysvix" # Change this to the twitter handle for your event such as devopsdayschi or devopsdaysmsp
event_social_mastodon: "" # Change this to url to your mastodon page
event_social_bsky: "" # Change this to url to your bluesky page
event_social_youtube: "" # Change this to the youtube channel handle for your event such as devopsdaysrox


# Social Share Buttons
# Optional: Specify which social share buttons to display on event pages.
# If not specified, defaults to all: ["email", "twitter", "facebook", "linkedin"]
# Valid values: "email", "twitter", "facebook", "linkedin"
# Example: social_shares: ["email", "linkedin"]  # Only show email and LinkedIn share buttons
social_shares: # ["email", "twitter", "facebook", "linkedin"]

nav_elements: # List of pages you want to show up in the navigation of your page.
  - name: Chamadas (CFP)
    url: /events/2027-vitoria/propose
  - name: Local
    url: /events/2027-vitoria/location
  - name: Inscrições
    url: https://tickets.devopsdays.org/devopsdays-vitoria/vix-2027/
  # - name: Programação
  #   url: /events/2027-vitoria/program
  # - name: Palestrantes
  #   url: /events/2027-vitoria/speakers
  - name: Patrocinadores
    url: /events/2027-vitoria/sponsor
  - name: Contato
    url: /events/2027-vitoria/contact
  - name: Código de Conduta
    url: /events/2027-vitoria/conduct-pt-br

